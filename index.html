<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | Fylo data storage component</title>
</head>

<body>

  <main class="container-fluid">

    <div class="row align-items-end g-4">

      <!-- FYLO CARD -->
      <div class="col-12 col-md-5">

        <div class="fylo-card">

          <img src="./images/logo.svg" alt="Fylo logo">

          <div class="d-flex gap-3">

            <button class="icon-button" type="button" aria-label="Documents">
              <img src="./images/icon-document.svg" alt="">
            </button>

            <button class="icon-button" type="button" aria-label="Folders">
              <img src="./images/icon-folder.svg" alt="">
            </button>

            <button class="icon-button" type="button" aria-label="Upload">
              <img src="./images/icon-upload.svg" alt="">
            </button>

          </div>

        </div>

      </div>


      <!-- STORAGE CARD -->
      <div class="col-12 col-md-7">

        <div class="storage-card">

          <div class="storage-left">
            <strong>185</strong>
            <span>GB LEFT</span>
          </div>

          <p>
            You've used <strong>815 GB</strong> of your storage
          </p>

          <div class="progress">
            <div class="progress-bar" role="progressbar" aria-label="Storage used" aria-valuenow="815" aria-valuemin="0"
              aria-valuemax="1000"></div>
          </div>

          <div class="d-flex justify-content-between">
            <strong>0 GB</strong>
            <strong>1000 GB</strong>
          </div>

        </div>

      </div>

    </div>

  </main>


  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor
    </a>.
    Coded by <a href="#">Ebony Mitchell</a>.
  </footer>

</body>

</html>
